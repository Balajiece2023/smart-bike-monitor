name: smart_bike_app
description: "Production-grade Flutter Smart Bike App with Riverpod & BLE Protocol Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_reactive_ble: ^5.2.0
  freezed_annotation: ^2.4.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
